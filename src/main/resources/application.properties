spring.application.name=ColegioAdmin

# Conexión con el servidor + workbench de MySQL
spring.datasource.url=jdbc:mysql://localhost:${port}/colegio
spring.datasource.username=user
spring.datasource.password=password

#Ajusta el esquema existente para que coincida con tus entidades.
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola
spring.jpa.show-sql=true

# Formatear SQL para mejor lectura
spring.jpa.properties.hibernate.format_sql=true

# Perfil de desarrollo
spring.profiles.active=dev

# FreeMarker
spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.suffix=.ftl
spring.freemarker.cache=false
